{{define "form/streamKCP"}}
<a-form layout="inline">
    <a-form-item label="Ngụy trang">
        <a-select v-model="inbound.stream.kcp.type" style="width: 280px;">
            <a-select-option value="none">none (không ngụy trang)</a-select-option>
            <a-select-option value="srtp">srtp (ngụy trang cuộc gọi video)</a-select-option>
            <a-select-option value="utp">utp (ngụy trang tải BitTorrent)</a-select-option>
            <a-select-option value="wechat-video">wechat-video (ngụy trang video WeChat)</a-select-option>
            <a-select-option value="dtls">dtls (ngụy trang gói DTLS 1.2)</a-select-option>
            <a-select-option value="wireguard">wireguard (ngụy trang gói WireGuard)</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="Mật khẩu">
        <a-input v-model.number="inbound.stream.kcp.seed"></a-input>
    </a-form-item>
    <a-form-item label="mtu">
        <a-input type="number" v-model.number="inbound.stream.kcp.mtu"></a-input>
    </a-form-item>
    <a-form-item label="tti (ms)">
        <a-input type="number" v-model.number="inbound.stream.kcp.tti"></a-input>
    </a-form-item>
    <a-form-item label="Dung lượng truyền lên (MB/s)">
        <a-input type="number" v-model.number="inbound.stream.kcp.upCap"></a-input>
    </a-form-item>
    <a-form-item label="Dung lượng truyền xuống (MB/s)">
        <a-input type="number" v-model.number="inbound.stream.kcp.downCap"></a-input>
    </a-form-item>
    <a-form-item label="Kiểm soát tắc nghẽn">
        <a-switch v-model="inbound.stream.kcp.congestion"></a-switch>
    </a-form-item>
    <a-form-item label="Bộ đệm đọc (MB)">
        <a-input type="number" v-model.number="inbound.stream.kcp.readBuffer"></a-input>
    </a-form-item>
    <a-form-item label="Bộ đệm ghi (MB)">
        <a-input type="number" v-model.number="inbound.stream.kcp.writeBuffer"></a-input>
    </a-form-item>
</a-form>
{{end}}

{{define "form/streamQUIC"}}
<a-form layout="inline">
    <a-form-item label="Mã hóa">
        <a-select v-model="inbound.stream.quic.security" style="width: 165px;">
            <a-select-option value="none">Không</a-select-option>
            <a-select-option value="aes-128-gcm">aes-128-gcm</a-select-option>
            <a-select-option value="chacha20-poly1305">chacha20-poly1305</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item label="Mật khẩu">
        <a-input v-model.trim="inbound.stream.quic.key"></a-input>
    </a-form-item>
    <a-form-item label="Ngụy trang">
        <a-select v-model="inbound.stream.quic.type" style="width: 280px;">
            <a-select-option value="none">none (không ngụy trang)</a-select-option>
            <a-select-option value="srtp">srtp (ngụy trang cuộc gọi video)</a-select-option>
            <a-select-option value="utp">utp (ngụy trang tải BitTorrent)</a-select-option>
            <a-select-option value="wechat-video">wechat-video (ngụy trang video WeChat)</a-select-option>
            <a-select-option value="dtls">dtls (ngụy trang gói DTLS 1.2)</a-select-option>
            <a-select-option value="wireguard">wireguard (ngụy trang gói WireGuard)</a-select-option>
        </a-select>
    </a-form-item>
</a-form>
{{end}}
